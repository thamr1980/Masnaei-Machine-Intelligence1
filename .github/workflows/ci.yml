name: CI
 
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 
      # Works both when the project files are committed normally (src/ exists in the repo root)
      # and when the repository only contains the uploaded Masnaei*.zip archive.
      - name: Locate project
        shell: bash
        run: |
          if [ -d src ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            zip_file=$(ls Masnaei*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$zip_file" ]; then
              echo "::error::No src folder and no Masnaei*.zip archive found in the repository root."
              exit 1
            fi
            unzip -q "$zip_file" -d "$RUNNER_TEMP/extracted"
            src_dir=$(find "$RUNNER_TEMP/extracted" -type d -name src -print -quit)
            if [ -z "$src_dir" ]; then
              echo "::error::The archive does not contain a src folder."
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$src_dir")" >> "$GITHUB_ENV"
          fi
 
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
 
      - name: Show SDK and project layout
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dotnet --info
          find . -name '*.csproj' | sort
 
      - name: Create solution file if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if ! ls ./*.sln >/dev/null 2>&1; then
            dotnet new sln -n Masnaei
            find . -name '*.csproj' -print0 | sort -z | xargs -0 -n1 dotnet sln Masnaei.sln add
          fi
          dotnet sln list
 
      - name: Restore NuGet dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore
 
      - name: Build (Release)
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet build --configuration Release --no-restore
 
      - name: Test (Release)
        working-directory: ${{ env.PROJECT_DIR }}
        run: >
          dotnet test --configuration Release --no-build
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
 
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PROJECT_DIR }}/TestResults/*.trx
          if-no-files-found: warn
 
