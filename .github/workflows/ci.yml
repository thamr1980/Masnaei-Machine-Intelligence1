
name: Masnaei .NET CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          if [ -d src ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            zip_file=$(find . -maxdepth 1 -type f -name 'Masnaei*.zip' -print -quit)
            if [ -z "$zip_file" ]; then
              echo "::error::Project source or Masnaei ZIP file not found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/masnaei"
            unzip -q "$zip_file" -d "$RUNNER_TEMP/masnaei"

            src_dir=$(find "$RUNNER_TEMP/masnaei" -type d -name src -print -quit)

            if [ -z "$src_dir" ]; then
              echo "::error::ZIP does not contain a src directory."
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$src_dir")" >> "$GITHUB_ENV"
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show project files
        shell: bash
        run: |
          dotnet --info
          find "$PROJECT_DIR" -name '*.csproj' -print

      - name: Create solution if missing
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if ! find . -maxdepth 1 -name '*.sln' | grep -q .; then
            dotnet new sln -n Masnaei
            find . -name '*.csproj' -print0 | while IFS= read -r -d '' project; do
              dotnet sln Masnaei.sln add "$project"
            done
          fi

      - name: Restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: >
          dotnet test
          --configuration Release
          --no-build
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masnaei-test-results
          path: ${{ env.PROJECT_DIR }}/TestResults/**/*.trx
          if-no-files-found: warn
